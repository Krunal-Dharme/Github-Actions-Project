name: AI Agent - Investigate Failures

# Enterprise failure monitor — zero per-pipeline changes, no workflow name list, no cron.
#
# Uses the workflow_job event: GitHub fires it for every job completion in this repo.
# We wait until the parent workflow run is fully completed and failed, then investigate once.
#
# Deploy: copy this workflow + .github/actions/investigate-pipeline-failure/ into each repo
# (or use an org repository template / ruleset).
on:
  workflow_job:
    types:
      - completed
  workflow_dispatch:
    inputs:
      workflow-run-id:
        description: GitHub Actions run ID to investigate
        required: true
        type: string
      conclusion:
        description: Workflow conclusion
        required: false
        default: failure
        type: string

permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: read

jobs:
  investigate:
    name: AI Agent - Investigate Failures
    # Fast pre-filter: skip successful job completions (workflow still wakes, job exits immediately).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_job' && github.event.workflow_job.conclusion == 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: investigate-failures-${{ github.event.workflow_job.run_id || inputs.workflow-run-id }}
      cancel-in-progress: false
    steps:
      - name: Resolve failed workflow run
        id: target
        uses: actions/github-script@v7
        with:
          script: |
            const monitorWorkflowPaths = new Set([
              ".github/workflows/investigate-failures.yml",
            ]);

            if (context.eventName === "workflow_dispatch") {
              const runId = "${{ inputs.workflow-run-id }}".trim();
              if (!runId) {
                core.setFailed("workflow-run-id is required for manual dispatch.");
                return;
              }
              core.setOutput("proceed", "true");
              core.setOutput("run_id", runId);
              core.setOutput("conclusion", "${{ inputs.conclusion }}" || "failure");
              return;
            }

            const job = context.payload.workflow_job;
            const runId = job.run_id;

            const { data: run } = await github.rest.actions.getWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: runId,
            });

            if (monitorWorkflowPaths.has(run.path ?? "")) {
              core.info(`Skipping monitor workflow run ${runId}.`);
              core.setOutput("proceed", "false");
              return;
            }

            if (run.status !== "completed") {
              core.info(`Workflow run ${runId} still ${run.status}; waiting for completion.`);
              core.setOutput("proceed", "false");
              return;
            }

            if (!run.conclusion || run.conclusion === "success") {
              core.info(`Workflow run ${runId} conclusion=${run.conclusion}; no investigation needed.`);
              core.setOutput("proceed", "false");
              return;
            }

            core.info(`Investigating failed workflow run ${runId} (${run.name}, conclusion=${run.conclusion}).`);
            core.setOutput("proceed", "true");
            core.setOutput("run_id", String(run.id));
            core.setOutput("conclusion", run.conclusion);

      - name: Checkout code
        if: steps.target.outputs.proceed == 'true'
        uses: actions/checkout@v4

      - name: Run investigation
        if: steps.target.outputs.proceed == 'true'
        uses: ./.github/actions/investigate-pipeline-failure
        with:
          workflow-run-id: ${{ steps.target.outputs.run_id }}
          conclusion: ${{ steps.target.outputs.conclusion }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          MODEL_NAME: ${{ vars.OPENROUTER_MODEL || 'anthropic/claude-3.5-sonnet' }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          POSTGRES_DSN: ${{ secrets.POSTGRES_DSN }}
          POSTGRES_HOST: ${{ secrets.POSTGRES_HOST }}
          POSTGRES_PORT: ${{ secrets.POSTGRES_PORT || '5432' }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_SSLMODE: ${{ vars.POSTGRES_SSLMODE || 'require' }}
          ENABLE_DB: ${{ vars.ENABLE_DB || vars.POSTGRES_ENABLED || 'false' }}
          POSTGRES_ENABLED: ${{ vars.POSTGRES_ENABLED || vars.ENABLE_DB || 'false' }}
          POSTGRES_AUDIT_ENABLED: ${{ vars.POSTGRES_AUDIT_ENABLED || 'true' }}
          ENABLE_EMAIL_NOTIFICATIONS: ${{ vars.ENABLE_EMAIL_NOTIFICATIONS || vars.EMAIL_ENABLED || 'false' }}
          EMAIL_ENABLED: ${{ vars.EMAIL_ENABLED || vars.ENABLE_EMAIL_NOTIFICATIONS || 'false' }}
          EMAIL_SMTP_HOST: ${{ secrets.EMAIL_SMTP_HOST }}
          SMTP_HOST: ${{ vars.SMTP_HOST }}
          EMAIL_SMTP_PORT: ${{ secrets.EMAIL_SMTP_PORT }}
          SMTP_PORT: ${{ vars.SMTP_PORT || '587' }}
          EMAIL_USERNAME: ${{ secrets.EMAIL_USERNAME }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          SMTP_FROM: ${{ vars.SMTP_FROM }}
          EMAIL_TO: ${{ vars.EMAIL_TO }}
          EMAIL_RECIPIENTS: ${{ vars.EMAIL_RECIPIENTS }}
