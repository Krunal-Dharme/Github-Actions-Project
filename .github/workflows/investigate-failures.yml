name: AI Agent - Investigate Failures

# Centralized failure monitor — no changes required in individual pipeline workflows.
#
# Triggers:
#   1. workflow_run  — immediate investigation when listed workflows finish
#   2. schedule      — polls GitHub API for ANY failed run (no workflow name list)
#   3. workflow_dispatch — manual investigation by run ID
on:
  workflow_run:
    workflows:
      - CICD Pipeline
    types:
      - completed
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      workflow-run-id:
        description: GitHub Actions run ID to investigate (leave empty to scan recent failures)
        required: false
        type: string
      conclusion:
        description: Workflow conclusion
        required: false
        default: failure
        type: string

permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: read

jobs:
  discover:
    name: Discover failed workflow runs
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.find.outputs.matrix }}
      has_runs: ${{ steps.find.outputs.has_runs }}
    steps:
      - name: Find workflow runs to investigate
        id: find
        uses: actions/github-script@v7
        with:
          script: |
            const monitorWorkflowPaths = [
              ".github/workflows/investigate-failures.yml",
            ];
            const include = [];

            const addRun = (runId, conclusion) => {
              if (!runId) return;
              include.push({
                run_id: String(runId),
                conclusion: conclusion || "failure",
              });
            };

            if (context.eventName === "workflow_dispatch") {
              const runId = "${{ inputs.workflow-run-id }}".trim();
              if (runId) {
                addRun(runId, "${{ inputs.conclusion }}");
              } else {
                core.info("No run ID provided — scanning recent failures via API.");
              }
            }

            if (context.eventName === "workflow_run") {
              const wr = context.payload.workflow_run;
              const isMonitor = monitorWorkflowPaths.some((path) => wr.path === path);
              if (!isMonitor && wr.conclusion && wr.conclusion !== "success") {
                addRun(wr.id, wr.conclusion);
              }
            }

            if (context.eventName === "schedule" || (context.eventName === "workflow_dispatch" && !"${{ inputs.workflow-run-id }}".trim())) {
              const lookbackMinutes = Number("${{ vars.INVESTIGATION_LOOKBACK_MINUTES || '30' }}");
              const cutoff = Date.now() - lookbackMinutes * 60 * 1000;

              const { data: failedRuns } = await github.rest.actions.listWorkflowRunsForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
                status: "failure",
                per_page: 50,
              });

              const { data: issuePage } = await github.rest.issues.listForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: "all",
                labels: "pipeline-failure",
                per_page: 100,
              });

              const investigatedRunIds = new Set();
              for (const issue of issuePage) {
                const haystack = `${issue.title}\n${issue.body || ""}`;
                for (const match of haystack.matchAll(/\*\*Run ID\*\*:\s*(\d+)/g)) {
                  investigatedRunIds.add(Number(match[1]));
                }
                for (const match of haystack.matchAll(/Run #(\d+)/g)) {
                  investigatedRunIds.add(Number(match[1]));
                }
              }

              for (const run of failedRuns.workflow_runs) {
                const createdAt = new Date(run.created_at).getTime();
                const isMonitor = monitorWorkflowPaths.some((path) => run.path === path);
                if (createdAt < cutoff || isMonitor) continue;
                if (investigatedRunIds.has(run.id)) continue;
                if (include.some((item) => item.run_id === String(run.id))) continue;
                include.push({
                  run_id: String(run.id),
                  conclusion: run.conclusion || "failure",
                });
              }
            }

            const unique = [];
            const seen = new Set();
            for (const item of include) {
              if (seen.has(item.run_id)) continue;
              seen.add(item.run_id);
              unique.push(item);
            }

            core.info(`Runs queued for investigation: ${unique.map((item) => item.run_id).join(", ") || "(none)"}`);
            core.setOutput("matrix", JSON.stringify({ include: unique }));
            core.setOutput("has_runs", unique.length > 0 ? "true" : "false");

  investigate:
    name: AI Agent - Investigate Failures
    needs: discover
    if: needs.discover.outputs.has_runs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.discover.outputs.matrix) }}
    concurrency:
      group: investigate-failures-${{ matrix.run_id }}
      cancel-in-progress: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run investigation
        uses: ./.github/actions/investigate-pipeline-failure
        with:
          workflow-run-id: ${{ matrix.run_id }}
          conclusion: ${{ matrix.conclusion }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          MODEL_NAME: ${{ vars.OPENROUTER_MODEL || 'anthropic/claude-3.5-sonnet' }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          POSTGRES_DSN: ${{ secrets.POSTGRES_DSN }}
          POSTGRES_HOST: ${{ secrets.POSTGRES_HOST }}
          POSTGRES_PORT: ${{ secrets.POSTGRES_PORT || '5432' }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_SSLMODE: ${{ vars.POSTGRES_SSLMODE || 'require' }}
          ENABLE_DB: ${{ vars.ENABLE_DB || vars.POSTGRES_ENABLED || 'false' }}
          POSTGRES_ENABLED: ${{ vars.POSTGRES_ENABLED || vars.ENABLE_DB || 'false' }}
          POSTGRES_AUDIT_ENABLED: ${{ vars.POSTGRES_AUDIT_ENABLED || 'true' }}
          ENABLE_EMAIL_NOTIFICATIONS: ${{ vars.ENABLE_EMAIL_NOTIFICATIONS || vars.EMAIL_ENABLED || 'false' }}
          EMAIL_ENABLED: ${{ vars.EMAIL_ENABLED || vars.ENABLE_EMAIL_NOTIFICATIONS || 'false' }}
          EMAIL_SMTP_HOST: ${{ secrets.EMAIL_SMTP_HOST }}
          SMTP_HOST: ${{ vars.SMTP_HOST }}
          EMAIL_SMTP_PORT: ${{ secrets.EMAIL_SMTP_PORT }}
          SMTP_PORT: ${{ vars.SMTP_PORT || '587' }}
          EMAIL_USERNAME: ${{ secrets.EMAIL_USERNAME }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          SMTP_FROM: ${{ vars.SMTP_FROM }}
          EMAIL_TO: ${{ vars.EMAIL_TO }}
          EMAIL_RECIPIENTS: ${{ vars.EMAIL_RECIPIENTS }}
