name: AI Agent - Investigate Failures

# Manual re-run of investigation for a specific workflow run ID.
# Automatic investigation runs as a job inside each pipeline (see cicd-main.yml).
on:
  workflow_dispatch:
    inputs:
      workflow-run-id:
        description: GitHub Actions run ID to investigate
        required: true
        type: string
      conclusion:
        description: Workflow conclusion
        required: false
        default: failure
        type: string

jobs:
  investigate:
    name: AI Agent - Investigate Failures
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      issues: write
      pull-requests: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run investigation
        uses: ./.github/actions/investigate-pipeline-failure
        with:
          workflow-run-id: ${{ inputs.workflow-run-id }}
          conclusion: ${{ inputs.conclusion }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          MODEL_NAME: ${{ vars.OPENROUTER_MODEL || 'anthropic/claude-3.5-sonnet' }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          POSTGRES_DSN: ${{ secrets.POSTGRES_DSN }}
          POSTGRES_HOST: ${{ secrets.POSTGRES_HOST }}
          POSTGRES_PORT: ${{ secrets.POSTGRES_PORT || '5432' }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_SSLMODE: ${{ vars.POSTGRES_SSLMODE || 'require' }}
          ENABLE_DB: ${{ vars.ENABLE_DB || vars.POSTGRES_ENABLED || 'false' }}
          POSTGRES_ENABLED: ${{ vars.POSTGRES_ENABLED || vars.ENABLE_DB || 'false' }}
          POSTGRES_AUDIT_ENABLED: ${{ vars.POSTGRES_AUDIT_ENABLED || 'true' }}
          ENABLE_EMAIL_NOTIFICATIONS: ${{ vars.ENABLE_EMAIL_NOTIFICATIONS || vars.EMAIL_ENABLED || 'false' }}
          EMAIL_ENABLED: ${{ vars.EMAIL_ENABLED || vars.ENABLE_EMAIL_NOTIFICATIONS || 'false' }}
          EMAIL_SMTP_HOST: ${{ secrets.EMAIL_SMTP_HOST }}
          SMTP_HOST: ${{ vars.SMTP_HOST }}
          EMAIL_SMTP_PORT: ${{ secrets.EMAIL_SMTP_PORT }}
          SMTP_PORT: ${{ vars.SMTP_PORT || '587' }}
          EMAIL_USERNAME: ${{ secrets.EMAIL_USERNAME }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          SMTP_FROM: ${{ vars.SMTP_FROM }}
          EMAIL_TO: ${{ vars.EMAIL_TO }}
          EMAIL_RECIPIENTS: ${{ vars.EMAIL_RECIPIENTS }}
